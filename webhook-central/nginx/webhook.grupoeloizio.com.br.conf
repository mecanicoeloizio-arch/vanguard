# Nginx Server Block • Central Webhook Hub
# Subdomínio: webhook.grupoeloizio.com.br
# Repasse interno para EloMak, EloSign e Vanguard

server {
    listen 80;
    listen 443 ssl http2;
    server_name webhook.grupoeloizio.com.br;

    root /var/www/grupoeloizio.com.br/webhook-central/public;
    index index.php index.html;

    # SSL Certificados Let's Encrypt / Cloudflare
    ssl_certificate /etc/letsencrypt/live/webhook.grupoeloizio.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/webhook.grupoeloizio.com.br/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    access_log /var/log/nginx/webhook_central_access.log;
    error_log /var/log/nginx/webhook_central_error.log;

    client_max_body_size 32M;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Endpoint do Webhook Evolution com timeout estendido para alta concorrência
    location /webhook/evolution {
        try_files $uri /index.php?$query_string;
        fastcgi_read_timeout 60;
        fastcgi_pass unix:/var/run/php/php8.3-fpm.sock;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass unix:/var/run/php/php8.3-fpm.sock;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_read_timeout 60;
    }

    # Bloqueio de arquivos ocultos e config
    location ~ /\.(?!well-known).* {
        deny all;
    }
}
