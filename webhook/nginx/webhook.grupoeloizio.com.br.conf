# ==============================================================================
# Nginx Configuration • Hub Centralizado de Webhooks & Mercado Pago
# Subdomínio: webhook.grupoeloizio.com.br
# Grupo Eloizio 2026
# ==============================================================================

server {
    listen 80;
    listen 443 ssl http2;
    server_name webhook.grupoeloizio.com.br;

    # SSL Hostinger / Let's Encrypt
    ssl_certificate /etc/letsencrypt/live/webhook.grupoeloizio.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/webhook.grupoeloizio.com.br/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    root /var/www/grupoeloizio.com.br/webhook/public;
    index index.php index.html;

    client_max_body_size 50M;

    # Headers de Segurança e CORS para Mercado Pago & Evolution
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Access-Control-Allow-Origin "*" always;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Endpoint de Webhook de Alta Velocidade para Evolution API & Mercado Pago
    location ~* ^/(webhook|mercadopago|send|checkout) {
        try_files $uri $uri/ /index.php?$query_string;
        fastcgi_read_timeout 90;
        proxy_read_timeout 90;
    }

    # Bloqueio de pastas sensíveis
    location ~* ^/(config|storage|controllers)/ {
        deny all;
        return 404;
    }

    # Processamento PHP 8.3 FPM
    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTP_PROXY "";
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
        fastcgi_read_timeout 90;
    }

    # Cache de assets estáticos
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf)$ {
        expires 1y;
        add_header Cache-Control "public, no-transform";
        access_log off;
    }
}
