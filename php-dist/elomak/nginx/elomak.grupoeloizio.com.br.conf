# Nginx Server Block Oficial • EloMak
# Subdomínio: elomak.grupoeloizio.com.br
# Document Root: /elomak/public/
# PHP-FPM 8.3 • Grupo Eloizio 2026

server {
    listen 80;
    listen 443 ssl http2;
    server_name elomak.grupoeloizio.com.br;

    root /var/www/grupoeloizio.com.br/elomak/public;
    index index.php index.html;

    # SSL Certificados (Let's Encrypt / Certbot)
    ssl_certificate /etc/letsencrypt/live/elomak.grupoeloizio.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/elomak.grupoeloizio.com.br/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    access_log /var/log/nginx/elomak_access.log;
    error_log /var/log/nginx/elomak_error.log;

    client_max_body_size 32M;

    # Front Controller Pattern
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Bloqueio de pastas internas do sistema (Segurança Crítica)
    location ~ ^/(config|app|sql|storage/logs)/ {
        deny all;
        return 404;
    }

    # Processamento PHP-FPM 8.3
    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass unix:/var/run/php/php8.3-fpm.sock;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_read_timeout 60;
    }

    # Cache de Assets Estáticos por 1 ano
    location ~* \.(css|js|jpg|jpeg|png|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, no-transform";
        access_log off;
    }

    # Bloqueio de arquivos ocultos (.git, .env, .htaccess)
    location ~ /\.(?!well-known).* {
        deny all;
    }
}
